name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:

jobs:
  claude-review:
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.event.pull_request.title, 'chore(deps): bump ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read CLAUDE.md, then review this PR for must-fix issues only:
            - Bugs or logic errors in Go code, SQL, or workflows, including error paths that silently swallow failures
            - Security issues: auth bypass, JWT keyfuncs that don't validate the signing method, SQL built by string concatenation, secrets or PII in logs, overly-broad GH Actions permissions
            - Violations of CLAUDE.md's architecture and security invariants (e.g. internal/auth importing internal/clients/jellyfin, handlers using Jellyfin types, catalog IDs passed verbatim to Jellyfin)
            - New API routes without a handler test

            Skip anything CI already enforces (go vet, go test, golangci-lint, codegen drift, gitleaks), skip everything under internal/gen/ (generated by oapi-codegen), and skip style, subjective, or hypothetical feedback. The deferred `_ = tx.Rollback()` pattern is intentional.

            Post inline comments for must-fix issues, then one top-level summary — explicitly say "looks good" if there are none. Don't manufacture issues to appear thorough.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
