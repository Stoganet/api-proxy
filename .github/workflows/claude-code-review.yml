name: Claude Code Review

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
  workflow_dispatch:

jobs:
  claude-review:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.actor.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@e2a4b761cd77a1138a5b41410eda9b28581f9bcd # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
            HEAD SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

            Read REVIEW.md for review instructions, then read CLAUDE.md for project context,
            then review this pull request and follow the instructions in REVIEW.md exactly.

            After posting your review, set a commit status on HEAD SHA:
              gh api repos/${{ github.repository }}/statuses/${{ github.event.workflow_run.head_sha || github.sha }} \
                -f state=<success|failure> \
                -f context="claude-review" \
                -f description="<one line summary>"
            Use state=failure if you posted any Important findings, state=success otherwise.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api *),Read,Grep,Glob"
