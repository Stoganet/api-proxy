# Local development only. Production compose lives in stoganet/infra.
name: stoganet-dev

services:
  stoganet:
    build: ..
    image: stoganet:dev
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - stoganet_config:/data

volumes:
  stoganet_config:
